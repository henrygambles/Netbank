version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netbank
      POSTGRES_PASSWORD: netbank
      POSTGRES_DB: netbank
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netbank']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netbank-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  monero-wallet-rpc:
    image: sethsimmons/simple-monero-wallet-rpc:latest
    container_name: netbank-monero
    restart: unless-stopped
    ports:
      - '18082:18082'
    volumes:
      - monero_data:/wallet
    environment:
      - DAEMON_HOST=node.moneroworld.com
      - DAEMON_PORT=18089
      - RPC_BIND_PORT=18082
      - WALLET_DIR=/wallet
    command: >
      --rpc-bind-port=18082
      --daemon-address=node.moneroworld.com:18089
      --trusted-daemon
      --wallet-dir=/wallet
      --rpc-login=netbank:${XMR_RPC_PASS:-changeme}

volumes:
  postgres_data:
  redis_data:
  monero_data:
